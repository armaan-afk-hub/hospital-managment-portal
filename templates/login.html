{% extends 'base.html' %}

{% block title %}Login - MediCare Hospital{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="medicare-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle p-3 mb-2 border">
                        <i class="bi bi-person-lock fs-2" style="color: var(--medical-teal);"></i>
                    </div>
                    <h2 class="h4 mb-1">Welcome Back</h2>
                    <p class="text-secondary small">Sign in to your MediCare account</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-secondary"></i></span>
                            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center pt-2 border-top">
                    <p class="text-secondary small mb-0">
                        Don't have an account? <a href="{% url 'register' %}" class="fw-semibold text-decoration-none" style="color: var(--medical-teal);">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
